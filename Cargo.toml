[package]
name = "slack_mcp"
version = "0.1.0"
edition = "2021"
description = "Local MCP bridge for Slack automation via OS-level automation (no Slack API)"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
